[tool.poetry]
name = "schooladvisor-crud"
version = "0.1.0"
description = "CRUD de avaliacoes de escolas - School Advisor"
authors = ["Elen de Bona"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.136.3"
uvicorn = {extras = ["standard"], version = "^0.49.0"}
sqlalchemy = "^2.0.50"
psycopg2-binary = "^2.9.12"
streamlit = "^1.58.0"
requests = "^2.34.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"